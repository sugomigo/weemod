name: WeeMOD checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test module selector
        run: python -m unittest discover -s tests -v
      - name: Test JavaScript module
        run: node --test modules/async-retry/retry.test.mjs
